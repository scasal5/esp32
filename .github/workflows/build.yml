name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  harness-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test harness tools without hardware or IDF
        run: python -m unittest discover -s pocketjs-s3-harness/tests -v

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ws183-os
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32s3
          path: firmware
