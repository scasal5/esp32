dependencies:
  idf: ">=5.5,<5.6"

  # BSP de la placa. Trae por transitividad lvgl, esp_lvgl_port,
  # esp_codec_dev, esp_lcd_touch_cst816s y esp_lcd_panel_io_additions.
  waveshare/esp32_s3_touch_lcd_1_83: "^2.0.0"

  # El BSP declara lvgl ">=8,<10". Si el solver elige la 8, no compilan
  # ni lv_display_t ni lv_screen_active(). Pineamos la 9 explicitamente.
  lvgl/lvgl: "^9"

  # AXP2101. Se toma del repositorio del autor con tag fijo, en vez del fork
  # republicado por terceros que hay en el registro: el objetivo del proyecto
  # es codigo auditable y de origen conocido. dependencies.lock fija el commit
  # exacto (v0.3.3 = ef40b49af66fe3b1907ab74ca76e10c0dbf69012).
  xpowerslib:
    git: https://github.com/lewisxhe/XPowersLib.git
    version: v0.3.3
