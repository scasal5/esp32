<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 150" width="880" height="150" role="img" aria-label="Hardware verificado: relevado sobre una unidad real, cada dato con su fuente.">
  <rect width="880" height="150" fill="#0A0A0A"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif">
    <text x="64" y="72" fill="#FAFAFA" font-size="38" font-weight="600" letter-spacing="-1">Hardware</text>
    <text x="66" y="104" fill="#8A8A8A" font-size="15">Relevado sobre una unidad real. Cada dato indica su fuente.</text>
  </g>

  <text x="816" y="72" fill="#8A8A8A" font-size="13" text-anchor="end"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">solo lectura</text>

  <line x1="64" y1="132" x2="816" y2="132" stroke="#1F1F1F" stroke-width="1"/>
</svg>
