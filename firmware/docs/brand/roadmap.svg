<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" role="img" aria-label="Hoja de ruta. Fase 00, base: panel, splash y bateria, hecho. Fase 01a, imagen de inicio con el primer frame, hecho. Fase 01b, animacion del GIF, planeado. Fase 02, shell con gestos y registro de apps, parcial: barra de estado y carrusel hechos. Fase 03, app Fondo, planeado. Fase 04, WiFi con scan, QR y SoftAP, hecho. Fase 05, subir GIFs por la red local, planeado. Fase 06, hora por SNTP y OTA, parcial: el RTC ya funciona.">
