<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="ws183-os. Firmware abierto para la Waveshare ESP32-S3-Touch-LCD-1.83. ESP32-S3, 240 x 284, LVGL 9, ESP-IDF 5.5, open source.">
  <rect width="880" height="300" fill="#0A0A0A"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif">
    <text x="64" y="118" fill="#FAFAFA" font-size="64" font-weight="600" letter-spacing="-2">ws183-os</text>
    <text x="66" y="156" fill="#8A8A8A" font-size="17" letter-spacing="0.2">Firmware abierto para la Waveshare ESP32-S3-Touch-LCD-1.83.</text>
  </g>

  <line x1="64" y1="196" x2="816" y2="196" stroke="#1F1F1F" stroke-width="1"/>

  <g font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">
    <text x="64" y="238" fill="#FAFAFA" font-size="22" font-weight="500">ESP32-S3</text>
    <text x="216" y="238" fill="#FAFAFA" font-size="22" font-weight="500">240 × 284</text>
    <text x="384" y="238" fill="#FAFAFA" font-size="22" font-weight="500">LVGL 9</text>
