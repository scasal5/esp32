<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="Hardware: ESP32-S3 LX7 dual-core a 240 MHz, 8 MB de PSRAM octal a 80 MHz, 16 MB de flash QIO a 80 MHz, pantalla 240 por 284 ST7789 por SPI, PMU AXP2101 en solo lectura, tactil CST816S por I2C, IMU QMI8658 por I2C, codec de audio ES8311 con ADC ES7210, ranura microSD.">
  <rect width="880" height="380" fill="#0A0A0A"/>

  <g font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" fill="#FAFAFA" font-size="26" font-weight="500">
    <text x="64" y="86">ESP32-S3</text>
    <text x="344" y="86">8 MB</text>
    <text x="624" y="86">16 MB</text>

    <text x="64" y="196">240 × 284</text>
    <text x="344" y="196">AXP2101</text>
    <text x="624" y="196">CST816S</text>

    <text x="64" y="306">QMI8658</text>
    <text x="344" y="306">ES8311</text>
    <text x="624" y="306">microSD</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" fill="#8A8A8A" font-size="11" letter-spacing="1.6">
    <text x="64" y="112">SOC · LX7 DUAL-CORE 240 MHZ</text>
    <text x="344" y="112">PSRAM OCTAL 80 MHZ</text>
    <text x="624" y="112">FLASH QIO 80 MHZ</text>

    <text x="64" y="222">DISPLAY · ST7789 POR SPI</text>
    <text x="344" y="222">PMU · SOLO LECTURA</text>
    <text x="624" y="222">TACTIL · I2C</text>

    <text x="64" y="332">IMU · I2C</text>
    <text x="344" y="332">AUDIO · ADC ES7210</text>
    <text x="624" y="332">ALMACENAMIENTO</text>
  </g>

  <line x1="64" y1="142" x2="816" y2="142" stroke="#1F1F1F" stroke-width="1"/>
  <line x1="64" y1="252" x2="816" y2="252" stroke="#1F1F1F" stroke-width="1"/>
</svg>
