<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="Estado del proyecto. Funciona: panel ST7789 y backlight, bateria en solo lectura, imagen de inicio del primer frame, hora y estado en pantalla, carrusel de apps, WiFi scan y provision, RTC PCF85063A. En camino: animacion del GIF, gestos, registro de apps, app Fondo. Planeado: subida por red local, SNTP y OTA, IMU, audio, microSD.">
  <rect width="880" height="360" fill="#0A0A0A"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif">

    <!-- Columna 1: funciona -->
    <text x="64" y="56" fill="#FAFAFA" font-size="11" font-weight="600" letter-spacing="1.8">FUNCIONA</text>
    <line x1="64" y1="76" x2="304" y2="76" stroke="#2A2A2A" stroke-width="1"/>
    <g fill="#FAFAFA" font-size="14">
      <circle cx="68" cy="106" r="3.5" fill="#FAFAFA"/><text x="86" y="111">Panel ST7789 y backlight</text>
      <circle cx="68" cy="140" r="3.5" fill="#FAFAFA"/><text x="86" y="145">Bateria, solo lectura</text>
      <circle cx="68" cy="174" r="3.5" fill="#FAFAFA"/><text x="86" y="179">Imagen de inicio (frame 0)</text>
      <circle cx="68" cy="208" r="3.5" fill="#FAFAFA"/><text x="86" y="213">Hora y estado en pantalla</text>
      <circle cx="68" cy="242" r="3.5" fill="#FAFAFA"/><text x="86" y="247">Carrusel de apps</text>
      <circle cx="68" cy="276" r="3.5" fill="#FAFAFA"/><text x="86" y="281">WiFi: scan y provision</text>
      <circle cx="68" cy="310" r="3.5" fill="#FAFAFA"/><text x="86" y="315">RTC PCF85063A</text>
    </g>

    <!-- Columna 2: en camino -->
    <text x="344" y="56" fill="#B4B4B4" font-size="11" font-weight="600" letter-spacing="1.8">EN CAMINO</text>
    <line x1="344" y1="76" x2="584" y2="76" stroke="#2A2A2A" stroke-width="1"/>
    <g fill="#B4B4B4" font-size="14">
      <circle cx="348" cy="106" r="3.5" fill="#0A0A0A" stroke="#B4B4B4" stroke-width="1.2"/><circle cx="348" cy="106" r="1.4" fill="#B4B4B4"/><text x="366" y="111">Animacion del GIF</text>
      <circle cx="348" cy="140" r="3.5" fill="#0A0A0A" stroke="#B4B4B4" stroke-width="1.2"/><circle cx="348" cy="140" r="1.4" fill="#B4B4B4"/><text x="366" y="145">Gestos</text>
      <circle cx="348" cy="174" r="3.5" fill="#0A0A0A" stroke="#B4B4B4" stroke-width="1.2"/><circle cx="348" cy="174" r="1.4" fill="#B4B4B4"/><text x="366" y="179">Registro de apps</text>
      <circle cx="348" cy="208" r="3.5" fill="#0A0A0A" stroke="#B4B4B4" stroke-width="1.2"/><circle cx="348" cy="208" r="1.4" fill="#B4B4B4"/><text x="366" y="213">App Fondo</text>
    </g>

    <!-- Columna 3: planeado -->
    <text x="624" y="56" fill="#8A8A8A" font-size="11" font-weight="600" letter-spacing="1.8">PLANEADO</text>
    <line x1="624" y1="76" x2="816" y2="76" stroke="#2A2A2A" stroke-width="1"/>
    <g fill="#8A8A8A" font-size="14">
      <circle cx="628" cy="106" r="3.5" fill="none" stroke="#5A5A5A" stroke-width="1.2"/><text x="646" y="111">Subida por red local</text>
      <circle cx="628" cy="140" r="3.5" fill="none" stroke="#5A5A5A" stroke-width="1.2"/><text x="646" y="145">SNTP y OTA</text>
      <circle cx="628" cy="174" r="3.5" fill="none" stroke="#5A5A5A" stroke-width="1.2"/><text x="646" y="179">IMU</text>
      <circle cx="628" cy="208" r="3.5" fill="none" stroke="#5A5A5A" stroke-width="1.2"/><text x="646" y="213">Audio</text>
      <circle cx="628" cy="242" r="3.5" fill="none" stroke="#5A5A5A" stroke-width="1.2"/><text x="646" y="247">microSD</text>
    </g>

  </g>
</svg>
