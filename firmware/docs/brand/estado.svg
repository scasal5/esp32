<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="Estado del proyecto. Funciona: panel ST7789 y backlight, bateria en solo lectura, fondo GIF animado, hora y estado en pantalla, carrusel y registro de apps, WiFi scan y provision, RTC PCF85063A, Fondo con subida por la red. En camino: gestos, encuadre y dibujo en Fondo. Planeado: SNTP y OTA, IMU, audio, microSD.">
  <rect width="880" height="360" fill="#0A0A0A"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif">

    <!-- Columna 1: funciona -->
    <text x="64" y="56" fill="#FAFAFA" font-size="11" font-weight="600" letter-spacing="1.8">FUNCIONA</text>
    <line x1="64" y1="76" x2="304" y2="76" stroke="#2A2A2A" stroke-width="1"/>
    <g fill="#FAFAFA" font-size="14">
      <circle cx="68" cy="102" r="3.5" fill="#FAFAFA"/><text x="86" y="107">Panel ST7789 y backlight</text>
      <circle cx="68" cy="130" r="3.5" fill="#FAFAFA"/><text x="86" y="135">Bateria, solo lectura</text>
      <circle cx="68" cy="158" r="3.5" fill="#FAFAFA"/><text x="86" y="163">Fondo GIF animado</text>
      <circle cx="68" cy="186" r="3.5" fill="#FAFAFA"/><text x="86" y="191">Hora y estado en pantalla</text>
      <circle cx="68" cy="214" r="3.5" fill="#FAFAFA"/><text x="86" y="219">Carrusel y registro de apps</text>
      <circle cx="68" cy="242" r="3.5" fill="#FAFAFA"/><text x="86" y="247">WiFi: scan y provision</text>
      <circle cx="68" cy="270" r="3.5" fill="#FAFAFA"/><text x="86" y="275">RTC PCF85063A</text>
      <circle cx="68" cy="298" r="3.5" fill="#FAFAFA"/><text x="86" y="303">Fondo: subida por la red</text>
    </g>

    <!-- Columna 2: en camino -->
    <text x="344" y="56" fill="#B4B4B4" font-size="11" font-weight="600" letter-spacing="1.8">EN CAMINO</text>
    <line x1="344" y1="76" x2="584" y2="76" stroke="#2A2A2A" stroke-width="1"/>
    <g fill="#B4B4B4" font-size="14">
      <circle cx="348" cy="102" r="3.5" fill="#0A0A0A" stroke="#B4B4B4" stroke-width="1.2"/><circle cx="348" cy="102" r="1.4" fill="#B4B4B4"/><text x="366" y="107">Gestos</text>
      <circle cx="348" cy="136" r="3.5" fill="#0A0A0A" stroke="#B4B4B4" stroke-width="1.2"/><circle cx="348" cy="136" r="1.4" fill="#B4B4B4"/><text x="366" y="141">Encuadre y dibujo en Fondo</text>
    </g>

    <!-- Columna 3: planeado -->
    <text x="624" y="56" fill="#8A8A8A" font-size="11" font-weight="600" letter-spacing="1.8">PLANEADO</text>
    <line x1="624" y1="76" x2="816" y2="76" stroke="#2A2A2A" stroke-width="1"/>
    <g fill="#8A8A8A" font-size="14">
      <circle cx="628" cy="102" r="3.5" fill="none" stroke="#5A5A5A" stroke-width="1.2"/><text x="646" y="107">SNTP y OTA</text>
      <circle cx="628" cy="136" r="3.5" fill="none" stroke="#5A5A5A" stroke-width="1.2"/><text x="646" y="141">IMU</text>
      <circle cx="628" cy="170" r="3.5" fill="none" stroke="#5A5A5A" stroke-width="1.2"/><text x="646" y="175">Audio</text>
      <circle cx="628" cy="204" r="3.5" fill="none" stroke="#5A5A5A" stroke-width="1.2"/><text x="646" y="209">microSD</text>
    </g>

  </g>
</svg>
